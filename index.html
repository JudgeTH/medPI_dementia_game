<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4CAF50" />

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="เกมฝึกสมอง" />

  <title>เกมฝึกสมองสำหรับผู้สูงอายุ</title>

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/reset.css" />

  <link rel="stylesheet" href="css/components.css" />

  <style>
    /* Character layout */
    #image-character-container .character-display-area{
      display:flex; justify-content:space-between; align-items:center;
      width:92%; max-width:980px; padding:0 16px;
    }
    #image-character-container .character-info.in-stage{ 
      order:1; text-align:left; max-width:240px; 
    }
    #image-character-container .character-container{ 
      order:2; width:220px !important; height:330px !important; 
    }
    #image-character-container .character-nameplate h3{ 
      font-size:3.5rem !important; letter-spacing:.2px; 
    }
    #image-character-container .character-stats{ gap:10px !important; }
    #image-character-container .stat-item{ font-size:1.1rem !important; }
    #image-character-container .stat-icon{
      font-size:1.6rem !important; min-width:26px !important;
    }
    #image-character-container .stat-label{ font-weight:600; }
    #image-character-container .stat-value{ font-size:1.35rem !important; }
    #image-character-container .emotion-controls{ gap:12px !important; }
    #image-character-container .emotion-btn{
      width:52px !important; height:52px !important; font-size:1.35rem !important;
    }
    #image-character-container .character-shadow{ display:none !important; }
    #image-character-container .character-container{
      width:240px !important; height:360px !important;
    }

    /* Action cards */
    .action-buttons{ padding-left:16px !important; padding-right:16px !important; }
    .action-grid{
      display:grid !important; grid-template-columns:repeat(2,1fr) !important; gap:16px !important;
    }
    .action-card{
      min-height:140px !important; padding:16px 14px !important; border-radius:16px !important;
      background-color: #EAF4FF !important; border: 1px solid #CFE3FF !important;
      box-shadow: 0 2px 8px rgba(14, 35, 69, 0.08) !important;
    }
    .action-card .action-icon{
      font-size:2.2rem !important; margin-bottom:10px !important; line-height:1 !important;
    }
    .action-card h3{ font-size:1.3rem !important; margin:6px 0 4px !important; color: #0A2540 !important; }
    .action-card p{ font-size:.95rem !important; color: #1F2A44 !important; opacity: 1 !important; }
    .action-card:hover{
      background-color: #E3F0FF !important; transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(14, 35, 69, 0.12) !important;
    }
    /* --- Speech box (กรอบใสสำหรับกล่องข้อความ) --- */
    #image-character-container{ position: relative; } /* ให้เป็น anchor ของตำแหน่ง absolute */
    
    .speechbox-slot{
      position: absolute;
      top: 12px;
      right: 12px;
      width: 300px;          /* ปรับได้ตามขนาดรูปของคุณ */
      height: 180px;         /* ปรับได้ตามขนาดรูปของคุณ */
      pointer-events: none;  /* ไม่บังการกดปุ่มอีโมจิด้านล่าง */
      z-index: 30;           /* ให้อยู่บนสุด */
      background: transparent;
    }
    
    .speechbox-slot img{
      width: 100%;
      height: 100%;
      object-fit: contain;   /* รักษาสัดส่วนรูป ไม่บิดเบี้ยว */
      display: block;
    }
    
    /* มือถือ */
    @media (max-width: 768px){
      .speechbox-slot{
        top: 10px;
        right: 20px;
        width: 200px;
        height: 180px;
      }
    }

    /* ===== Floating effect for speech box ===== */
    @keyframes bobY {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); } /* ปรับเป็น -10px ได้ถ้าอยากลอยมากขึ้น */
    }
    
    /* ให้กล่องข้อความลอยขึ้นลงเบาๆ */
    .speechbox-slot img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      animation: bobY 4s ease-in-out infinite; /* 👈 เพิ่มบรรทัดนี้ */
    }


    /* Pet slot - พื้นหลังใส ขนาดใหญ่ขึ้น */
    .pet-slot {
      position: absolute;
      bottom: -20px;
      right: -40px;
      width: 180px;
      height: 180px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      z-index: 12;
      transition: all 0.3s ease;
    }
    .pet-slot:hover {
      transform: scale(1.1);
    }
    .pet-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    }

    /* Emotion effects */
    #image-character-container .effect-hearts,
    #image-character-container .effect-sparkles,
    #image-character-container .effect-thought,
    #image-character-container .effect-love{
      font-size: 2.4rem !important; top: -48px !important;
      text-shadow: 0 2px 6px rgba(0,0,0,.12);
    }

    /* Mobile */
    @media (max-width:768px){
      #image-character-container{ height:480px !important; }
      #image-character-container .character-container{ width:220px !important; height:330px !important; }
      #image-character-container .character-nameplate h3{ font-size:2.35rem !important; }
      #image-character-container .stat-item{ font-size:1.05rem !important; }
      #image-character-container .stat-icon{ font-size:1.5rem !important; min-width:24px !important; }
      #image-character-container .stat-value{ font-size:1.3rem !important; }
      #image-character-container .emotion-btn{ width:48px !important; height:48px !important; font-size:1.25rem !important; }
      .action-buttons{ padding-left:18px !important; padding-right:18px !important; }
      .action-grid{ gap:14px !important; }
      .action-card{ min-height:150px !important; padding:18px 16px !important; }
      .action-card .action-icon{ font-size:2.4rem !important; }
      .action-card h3{ font-size:1.35rem !important; }
      .pet-slot { width: 180px; height: 180px; right: -80px; bottom: -15px; }
      #image-character-container .effect-hearts,
      #image-character-container .effect-sparkles,
      #image-character-container .effect-thought,
      #image-character-container .effect-love{
        font-size: 2.1rem !important; top: -42px !important;
      }
    }
  </style>
</head>
<body>

  <script>
  /* PET SYSTEM */
  (function(){
    const PETS_BASE = 'assets/images/characters/pets/';
    const DEFAULT_PET = 'dog_01.png';
    
    function createPetSlot() {
      const charContainer = document.querySelector('#image-character-container .character-container') ||
                           document.querySelector('.character-container');
      
      if (!charContainer) {
        console.warn('⚠️ Character container not found');
        return null;
      }

      let petSlot = charContainer.querySelector('.pet-slot');
      if (petSlot) {
        console.log('✅ Pet slot exists');
        return petSlot;
      }

      petSlot = document.createElement('div');
      petSlot.className = 'pet-slot';
      petSlot.id = 'petSlot';
      charContainer.appendChild(petSlot);
      console.log('✅ Pet slot created');
      return petSlot;
    }

    function loadPet(petFileName) {
      const petSlot = createPetSlot();
      if (!petSlot) return;

      petSlot.innerHTML = '';
      const img = new Image();
      img.alt = 'สัตว์เลี้ยง';
      img.style.cssText = 'width:100%; height:100%; object-fit:contain;';
      
      const petPath = PETS_BASE + petFileName;
      console.log('🐕 Loading pet:', petPath);

      img.onload = function() {
        console.log('✅ Pet loaded:', petPath);
        petSlot.style.display = 'flex';
      };

      img.onerror = function() {
        console.error('❌ Pet load failed:', petPath);
        petSlot.innerHTML = '<div style="font-size:4rem">🐕</div>';
        petSlot.style.display = 'flex';
      };

      img.src = petPath;
      petSlot.appendChild(img);
    }

    function setPet(petFileName) {
      try {
        localStorage.setItem('currentPet', petFileName);
      } catch(e) {}
      loadPet(petFileName);
    }

    function getSavedPet() {
      try {
        return localStorage.getItem('currentPet') || DEFAULT_PET;
      } catch(e) {
        return DEFAULT_PET;
      }
    }

    function initPet() {
      const charContainer = document.querySelector('.character-container');
      if (!charContainer) {
        console.log('⏳ Waiting for character...');
        setTimeout(initPet, 500);
        return;
      }

      const savedPet = getSavedPet();
      console.log('🎯 Init pet:', savedPet);
      loadPet(savedPet);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initPet, 1000);
      });
    } else {
      setTimeout(initPet, 1000);
    }

    window.addEventListener('shop:petChange', function(event) {
      const petFile = event.detail && event.detail.pet;
      if (petFile) {
        console.log('🛒 Changing pet:', petFile);
        setPet(petFile);
      }
    });

    window.setPet = setPet;
    window.loadPet = loadPet;
    console.log('✅ Pet system ready');
  })();
  </script>

  <script>
  /* SPEECH BOX SYSTEM */
  (function(){
    const BASE_PATH = 'assets/images/characters/equipment/';
    // ใส่ชื่อไฟล์รูปกล่องข้อความของคุณที่นี่
    // ตัวอย่าง: block01.png, block02.png, block03.png ...
    const SPEECH_IMAGES = [
      'block01.png',
      // 'block02.png',
      // 'block03.png',
    ];
  
    const INTERVAL_MS = 5000; // เปลี่ยนรูปทุก 5 วินาที
    let timer = null;
    let lastIndex = -1;
  
    function getContainer(){
      // ใช้การ์ดตัวละครตัวเดียวกับที่แสดงอวาตาร์
      // (#image-character-container ถูกสร้างโดย character.js)
      return document.querySelector('#image-character-container')
          || document.querySelector('.character-section');
    }
  
    function ensureSlot(){
      const host = getContainer();
      if(!host) return null;
  
      let slot = host.querySelector('.speechbox-slot');
      if(!slot){
        slot = document.createElement('div');
        slot.className = 'speechbox-slot';
        host.appendChild(slot);
      }
      return slot;
    }
  
    function pickNextIndex(){
      if(SPEECH_IMAGES.length <= 1) return 0;
      let i = Math.floor(Math.random() * SPEECH_IMAGES.length);
      // เลี่ยงซ้ำรูปเดิมติดกัน
      if(i === lastIndex) i = (i + 1) % SPEECH_IMAGES.length;
      lastIndex = i;
      return i;
    }
  
    function showImage(fileName){
      const slot = ensureSlot();
      if(!slot) return;
  
      const img = new Image();
      img.alt = 'speech-box';
      img.decoding = 'async';
      img.loading = 'eager';
      img.src = BASE_PATH + fileName;
  
      // ป้องกันกระพริบ: รอโหลดเสร็จก่อนค่อยสลับ
      img.onload = () => {
        slot.innerHTML = '';
        slot.appendChild(img);
      };
    }
  
    function startRotation(){
      if(!SPEECH_IMAGES.length) return; // ไม่มีไฟล์ให้แสดง
  
      // แสดงทันที 1 รูป
      showImage(SPEECH_IMAGES[pickNextIndex()]);
  
      // แล้วค่อยสุ่มเปลี่ยนทุก 5 วิ
      clearInterval(timer);
      timer = setInterval(()=>{
        showImage(SPEECH_IMAGES[pickNextIndex()]);
      }, INTERVAL_MS);
    }
  
    function init(){
      const host = getContainer();
      if(!host){
        // รอให้ character.js สร้าง DOM เสร็จก่อน
        setTimeout(init, 500);
        return;
      }
      startRotation();
    }
  
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', ()=> setTimeout(init, 800));
    }else{
      setTimeout(init, 800);
    }
  })();
  </script>
