<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>เกมฝึกสมอง</title>

  <!-- ฟอนต์พื้นฐาน -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#faf7f7;
      --card:#ecfee9;
      --panel:#eaf2ff;
      --text:#0f172a;
      --muted:#64748b;
      --shadow:0 8px 20px rgba(15,23,42,.08);
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family:"Noto Sans Thai", system-ui, -apple-system, Segoe UI, Roboto, Arial, "Helvetica Neue", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .container{
      max-width:980px;
      margin:28px auto 56px;
      padding:0 20px;
    }

    /* Header */
    .page-title{
      font-weight:800;
      font-size:42px;
      letter-spacing:.5px;
      margin:0 0 14px;
    }

    /* Character card (พื้นที่สีเขียวอ่อน) */
    .character-card{
      position:relative;
      background:var(--card);
      border-radius:28px;
      box-shadow:var(--shadow);
      min-height:260px;
      padding:24px 24px 20px 24px;
      overflow:hidden;
    }
    .character-inner{
      display:flex;
      gap:16px;
      align-items:flex-end;
    }
    .avatar-wrap{
      width:180px;
      min-width:180px;
    }
    .avatar{
      width:180px;
      height:auto;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .pet{
      width:160px;
      height:auto;
      display:block;
      margin-top:-6px;
      user-select:none;
      -webkit-user-drag:none;
    }

    /* ปุ่มอีโมจิ */
    .emoji-bar{
      position:absolute;
      right:22px;
      bottom:20px;
      display:flex;
      gap:12px;
    }
    .emoji-btn{
      width:40px;
      height:40px;
      border-radius:999px;
      border:2px solid #c7e1ff;
      background:#fff;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
      cursor:pointer;
      transition:transform .08s ease;
    }
    .emoji-btn:active{ transform:scale(.96); }

    /* การ์ดเมนู */
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:22px;
      margin-top:28px;
    }
    .tile{
      background:#eaf2ff;
      border-radius:var(--radius);
      padding:30px 18px;
      text-align:center;
      box-shadow:var(--shadow);
    }
    .tile h3{ margin:10px 0 6px; font-size:20px; }
    .tile p{ margin:0; color:var(--muted); font-size:14px; }

    /* ===== Speech box (กรอบใสสำหรับกล่องข้อความ) ===== */
    #image-character-container{ position:relative; }
    .speechbox-slot{
      position:absolute;
      top:12px;
      right:12px;
      width:300px;     /* ปรับได้ตามขนาดรูปกล่องข้อความ */
      height:180px;    /* ปรับได้ตามขนาดรูปกล่องข้อความ */
      pointer-events:none;
      z-index:30;
      background:transparent;
    }
    .speechbox-slot img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    /* Responsive */
    @media (max-width: 820px){
      .avatar-wrap{ width:150px; min-width:150px; }
      .avatar{ width:150px; }
      .pet{ width:135px; }
      .speechbox-slot{ width:230px; height:140px; top:10px; right:10px; }
      .grid{ grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 class="page-title">สมชาย</h1>

    <!-- การ์ดตัวละคร -->
    <section class="character-card" id="image-character-container">
      <div class="character-inner">
        <div class="avatar-wrap">
          <img class="avatar" src="/assets/images/characters/owner.png" alt="owner">
          <img class="pet" src="/assets/images/characters/pets/dog_01.png" alt="pet">
        </div>
        <!-- พื้นที่ว่างสำหรับฉาก/พื้นหลัง เพิ่มคอนเทนต์อื่น ๆ ได้ -->
        <div style="flex:1 1 auto;"></div>
      </div>

      <!-- กรอบวางรูปกล่องข้อความ (จะถูกสคริปต์เติม <img> ให้เอง) -->
      <div class="speechbox-slot" aria-hidden="true"></div>

      <!-- ปุ่มอีโมจิ -->
      <div class="emoji-bar">
        <button class="emoji-btn">😊</button>
        <button class="emoji-btn">👋</button>
        <button class="emoji-btn">🤔</button>
        <button class="emoji-btn">💖</button>
      </div>
    </section>

    <!-- เมนูหลัก -->
    <section class="grid">
      <article class="tile">
        <div style="font-size:30px">🛒</div>
        <h3>ร้านค้า</h3>
        <p>ซื้อเสื้อผ้าและสัตว์เลี้ยง</p>
      </article>
      <article class="tile">
        <div style="font-size:30px">🎮</div>
        <h3>เล่นเกม</h3>
        <p>ทดสอบความจำและสมาธิ</p>
      </article>
      <article class="tile">
        <div style="font-size:30px">📊</div>
        <h3>สถิติ</h3>
        <p>ดูผลการเล่นของคุณ</p>
      </article>
      <article class="tile">
        <div style="font-size:30px">✨✨</div>
        <h3>แต่งตัว</h3>
        <p>ปรับแต่งตัวละครของคุณ</p>
      </article>
    </section>
  </main>

  <!-- ===== SPEECH BOX SYSTEM (สุ่มรูปทุก 5 วิ) ===== -->
  <script>
    (function(){
      // ใช้ absolute path เพื่อกัน path เพี้ยนเวลาเปลี่ยนตำแหน่งไฟล์ HTML
      const BASE_PATH = '/assets/images/characters/equipment/';
      // รายชื่อไฟล์รูปกล่องข้อความของคุณ (เพิ่ม/ลบได้ตามต้องการ)
      const SPEECH_IMAGES = [
        'block01.png',
        'block02.png',
        'block03.png'
      ];
      const INTERVAL_MS = 5000;

      let timer = null, lastIndex = -1;

      function pickNext(){
        if(SPEECH_IMAGES.length <= 1) return 0;
        let i = Math.floor(Math.random() * SPEECH_IMAGES.length);
        if(i === lastIndex) i = (i + 1) % SPEECH_IMAGES.length;
        lastIndex = i;
        return i;
      }
      function showImage(name){
        const slot = document.querySelector('.speechbox-slot');
        if(!slot) return;
        const img = new Image();
        img.alt = 'speech-box';
        img.decoding = 'async';
        img.src = name.startsWith('/') ? name : (BASE_PATH + name);
        img.onload = () => { slot.innerHTML=''; slot.appendChild(img); };
        img.onerror = () => console.warn('🔴 ไม่พบไฟล์กล่องข้อความ:', img.src);
      }
      function start(){
        if(!SPEECH_IMAGES.length) return;
        showImage(SPEECH_IMAGES[pickNext()]);
        clearInterval(timer);
        timer = setInterval(()=> showImage(SPEECH_IMAGES[pickNext()]), INTERVAL_MS);
      }
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', start);
      }else{
        start();
      }
    })();
  </script>
</body>
</html>
