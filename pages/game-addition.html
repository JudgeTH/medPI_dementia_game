<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PI Game — เกมบวกเลขเร็ว</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    :root{--radius:16px;--space:16px;}
    body{font-family:system-ui,"Noto Sans Thai",sans-serif;background:#fff;color:#111}
    .container{max-width:900px;margin:0 auto;padding:24px}
    .card{background:#f7f7f7;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);padding:24px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
    .pill{background:#eee;border-radius:999px;padding:6px 12px;font-size:14px}
    .q-card{display:grid;gap:16px}
    .prompt{font-size:46px;font-weight:800}
    .answer-form{display:grid;gap:12px}
    .answer-row{display:flex;gap:10px;align-items:center}
    .answer-input{
      flex:1;min-height:56px;border-radius:24px;border:2px solid transparent;
      background:#fff;box-shadow:0 6px 10px rgba(0,0,0,.08);font-size:32px;
      padding:0 16px;outline:none;
    }
    .answer-input:focus{border-color:#2962FF}
    .submit-btn{
      min-height:56px;border:none;border-radius:14px;padding:0 18px;font-size:18px;
      background:#2E7D32;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12);cursor:pointer
    }
    .feedback{min-height:28px;font-size:18px}
    .feedback.ok{color:#1B5E20}
    .feedback.no{color:#C62828}
    .summary{display:none}
    .summary.active{display:block}
    .big{font-size:48px;font-weight:800}

    /* ช่องรูปสรุปผล: โปร่งใส ไม่มีกรอบ โชว์เฉพาะรูป */
    #customAnimationSlot{
      display:grid;
      place-items:center;
      min-height:0;           /* ให้สูงตามรูปจริง */
      background:transparent; /* พื้นหลังโปร่งใส */
      border:none;            /* ไม่มีเส้นกรอบ */
      border-radius:0;        /* ไม่ต้องโค้งมุม */
      margin:12px 0 20px;
      overflow:visible;       /* อนุญาตให้รูปยื่นได้ถ้าจำเป็น */
      padding:0;
    }
    #customAnimationSlot img{max-width:100%;height:auto;display:block}

    @media (max-width:640px){
      .answer-row{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <div class="pill" id="phasePill">คำถาม</div>
        <div class="pill">ข้อที่ <b id="qIndex">0</b>/<span id="qTotal">7</span></div>
        <div class="pill">ถูก <b id="correctCount">0</b></div>
        <div class="pill">⭐ <b id="starsCount">0</b></div>
      </div>

      <!-- QUESTION PHASE (ข้อความ + ช่องพิมพ์คำตอบ) -->
      <div id="questionStage" class="q-card" aria-live="polite">
        <div class="prompt" id="prompt">กำลังโหลดคำถาม…</div>
        <form id="answerForm" class="answer-form" autocomplete="off">
          <div class="answer-row">
            <input id="answerInput" class="answer-input" inputmode="numeric" type="number" placeholder="พิมพ์คำตอบที่นี่" required />
            <button id="submitBtn" class="submit-btn" type="submit">ส่งคำตอบ ⏎</button>
          </div>
          <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        </form>
      </div>

      <!-- SUMMARY -->
      <div id="summary" class="summary">
        <h2>สรุปผล</h2>

        <!-- ช่องแสดงรูป/แอนิเมชันสรุป -->
        <div id="customAnimationSlot"></div>

        <div class="card" style="margin-bottom:12px">
          <div>คะแนนถูกต้อง</div>
          <div class="big" id="sumCorrect">0</div>
          <div>จากทั้งหมด <b id="sumTotal">7</b> ข้อ</div>
        </div>

        <div class="card">
          <div>ดาวที่ได้รับ (รวมโบนัสความไว)</div>
          <div class="big">⭐ <span id="sumStars">0</span></div>
        </div>

        <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
          <a class="pill" href="/">← กลับหน้าหลัก</a>
          <button id="playAgain" class="pill" type="button">เล่นอีกครั้ง</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ใช้งานร่วมกับไฟล์ JS ที่คุณแก้ renderSummaryAnimation แล้ว -->
  <script type="module" src="/js/game-addition.js"></script>
</body>
</html>
