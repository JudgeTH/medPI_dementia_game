<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>เกมคำใบ้ทีละคำ – ตรรกะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --shadow:0 8px 20px rgba(15,23,42,.08); --muted:#64748b; }
    body{ margin:0; font-family:"Noto Sans Thai",system-ui,sans-serif; background:#f6fbff; color:#0f172a; }
    .container{ max-width:980px; margin:18px auto 60px; padding:0 16px; }
    h1{ margin:0 0 10px; font-size:36px; }
    .toolbar{ display:flex; gap:10px; align-items:center; justify-content:flex-end; margin-bottom:10px; }
    .btn{ display:inline-flex; align-items:center; gap:6px; padding:10px 14px; border-radius:999px; border:2px solid #c7e1ff; background:#fff; box-shadow:var(--shadow); cursor:pointer; font-weight:700; }
    .btn:active{ transform:scale(.97); }
    .card{ background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:16px; }
    .muted{ color:var(--muted); font-size:14px; }
    .q-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .q-title{ font-size:22px; font-weight:700; }
    .choices{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .choice{ padding:14px; background:#eef6ff; border-radius:12px; cursor:pointer; text-align:center; border:2px solid transparent; }
    .choice:hover{ border-color:#b7d6ff; }
    .hint{ margin-top:12px; padding:10px 12px; background:#f7fbef; border-radius:12px; font-size:15px; display:none; }
    .footer{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
    .back-home{ position:fixed; right:20px; bottom:20px; z-index:50; }
  </style>
</head>
<body>
  <main class="container">
    <h1>เกมคำใบ้ทีละคำ</h1>

    <div class="toolbar">
      <button id="nextBtn" class="btn">⬆️ ข้อต่อไป</button>
      <button id="moreHintBtn" class="btn">🪄 ขอตัวใบ้เพิ่ม</button>
      <button id="revealAllHintsBtn" class="btn">🔓 เปิดคำใบ้ทั้งหมด</button>
    </div>

    <section id="quizCard" class="card">
      <div class="q-header">
        <div class="q-title"><span id="progress">คำใบ้ (0/7)</span></div>
        <button id="moreChoiceBtn" class="btn">🎲 ขอตัวเลือกเพิ่ม</button>
      </div>

      <div id="prompt" class="muted">-</div>

      <div id="choices" class="choices" aria-live="polite"></div>

      <div id="hintBox" class="hint"></div>

      <div class="footer">
        <small class="muted">กด “ขอตัวใบ้เพิ่ม” ได้เรื่อยๆ ก่อนตอบ</small>
        <div></div>
      </div>
    </section>
  </main>

  <a class="btn back-home" href="/index-11.html">🏠 กลับสู่หน้าหลัก</a>

  <script>
    // ===== Data loader (ป้องกัน error HTML 404 กลายเป็น '<') =====
    async function loadQuestions() {
      try {
        const res = await fetch('/data/questions/logic.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP '+res.status);
        const data = await res.json();
        if (!data || !Array.isArray(data.items)) throw new Error('Invalid payload');
        return data.items;
      } catch (e) {
        console.warn('⚠️ โหลดคำถามจาก /data/questions/logic.json ไม่ได้:', e);
        // Fallback: ตัวอย่างคำถามในตัว
        return [
          { id:'lg-001', prompt:'ในภาพ "ช้อน" ใช้ทำอะไร?', choices:['ตักอาหาร','ตัดกระดาษ'], answerIndex:0, hints:['เป็นอุปกรณ์บนโต๊ะอาหาร','ใช้คู่กับจานหรือชาม'] },
          { id:'lg-002', prompt:'กลางวันกับกลางคืน สิ่งใดสว่างกว่า?', choices:['กลางวัน','กลางคืน'], answerIndex:0, hints:['เกี่ยวกับดวงอาทิตย์'] },
          { id:'lg-003', prompt:'ร่ม ใช้ในสภาพอากาศแบบใด?', choices:['ฝนตก','แดดร้อนอย่างเดียว'], answerIndex:0, hints:['กันน้ำได้'] }
        ];
      }
    }

    // ===== Quiz state & logic =====
    const ui = {
      progress: document.getElementById('progress'),
      prompt: document.getElementById('prompt'),
      choices: document.getElementById('choices'),
      hintBox: document.getElementById('hintBox'),
      nextBtn: document.getElementById('nextBtn'),
      moreChoiceBtn: document.getElementById('moreChoiceBtn'),
      moreHintBtn: document.getElementById('moreHintBtn'),
      revealAllHintsBtn: document.getElementById('revealAllHintsBtn'),
      card: document.getElementById('quizCard'),
    };

    let questions = [];
    let idx = 0;
    let hintsShown = 0;

    function renderQuestion(q) {
      ui.progress.textContent = `คำใบ้ (${hintsShown}/7)`;
      ui.prompt.textContent = q.prompt || '-';
      ui.choices.innerHTML = '';
      (q.choices || []).forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = c;
        btn.onclick = () => handleAnswer(i === q.answerIndex);
        ui.choices.appendChild(btn);
      });
      ui.hintBox.style.display = 'none';
      ui.hintBox.textContent = '';
    }

    function handleAnswer(correct) {
      ui.card.style.boxShadow = correct
        ? '0 8px 24px rgba(46,125,50,.35)'
        : '0 8px 24px rgba(198,40,40,.35)';
      setTimeout(() => {
        ui.card.style.boxShadow = 'var(--shadow)';
        next();
      }, 600);
    }

    function next() {
      hintsShown = 0;
      idx = (idx + 1) % questions.length;
      renderQuestion(questions[idx]);
    }

    function addChoiceOption() {
      // ตัวอย่าง: หากมีตัวเลือกซ่อนอยู่ สามารถต่อยอดได้
      // ที่นี่เราจะสุ่มแทรก "ผ่าน" เพื่อให้ผู้สูงอายุไปต่อได้
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = 'ขอผ่านข้อนี้';
      btn.onclick = () => next();
      ui.choices.appendChild(btn);
    }

    function showOneHint() {
      const q = questions[idx];
      if (!q.hints || !q.hints.length) return;
      hintsShown = Math.min(7, hintsShown + 1);
      ui.progress.textContent = `คำใบ้ (${hintsShown}/7)`;
      const hint = q.hints[Math.min(q.hints.length - 1, hintsShown - 1)];
      ui.hintBox.textContent = hint ?? '—';
      ui.hintBox.style.display = 'block';
    }

    function revealAllHints() {
      const q = questions[idx];
      if (!q.hints || !q.hints.length) return;
      hintsShown = Math.min(7, q.hints.length);
      ui.progress.textContent = `คำใบ้ (${hintsShown}/7)`;
      ui.hintBox.textContent = q.hints.join(' • ');
      ui.hintBox.style.display = 'block';
    }

    // ===== Wire events =====
    ui.nextBtn.addEventListener('click', next);
    ui.moreChoiceBtn.addEventListener('click', addChoiceOption);
    ui.moreHintBtn.addEventListener('click', showOneHint);
    ui.revealAllHintsBtn.addEventListener('click', revealAllHints);

    // ===== Boot =====
    (async function init(){
      questions = await loadQuestions();
      if (!questions.length) {
        ui.prompt.textContent = 'ไม่พบคำถาม';
        return;
      }
      idx = 0;
      hintsShown = 0;
      renderQuestion(questions[idx]);
    })();
  </script>
</body>
</html>
